name: Unit 6 software acceptance
on: [push, pull_request]
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python src/generate_data.py
      - run: python src/evaluate.py
      - run: python -m pytest -q --cov=src --cov-branch --cov-report=term-missing --cov-report=json:results/unit6/coverage.json
      - run: python -m compileall -q src
      - run: python results/unit6/acceptance.py
      - uses: actions/upload-artifact@v4
        with:
          name: software-evidence
          path: results/unit6/coverage.json
